<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu | El Sombrero Express</title>
    <meta name="description" content="View the full menu for El Sombrero Express in Las Cruces, NM. Authentic Mexican takeout — tacos, burritos, enchiladas, fajitas, and more.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="icon" type="image/x-icon" href="../../public/favicon.ico">
    <script>
        (async function () {
            const fallback = document.getElementById('fallback');
            const opening = document.getElementById('opening');
            try {
                const res = await fetch('/api/menu-pdf?_=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (!data.exists) {
                        if (opening) opening.hidden = true;
                        if (fallback) fallback.hidden = false;
                        return;
                    }
                    const v = data.modified ? new Date(data.modified).getTime() : Date.now();
                    window.location.replace('../../public/menu.pdf?v=' + v);
                    return;
                }
            } catch (e) {}
            window.location.replace('../../public/menu.pdf');
        })();
    </script>
</head>
<body>
    <p id="opening" style="font-family: system-ui, sans-serif; padding: 2rem;">Opening menu PDF… <a href="../../public/menu.pdf">Click here if it does not open</a>.</p>
    <p id="fallback" hidden style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 36rem; line-height: 1.5;">
        Menu PDF is not published yet. Call <a href="tel:5753233322">575-323-3322</a>
        or email <a href="mailto:elsombreroexpress@gmail.com">elsombreroexpress@gmail.com</a>.
        <br><br>
        <a href="../../index.html">Back to home</a>
    </p>
</body>
</html>
