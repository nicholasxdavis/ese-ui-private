# Refresh daily specials from Facebook (OG via curl) and push into Cloudflare KV.

name: Update special of the day

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-special-of-the-day
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape Facebook OG + push to Worker KV
        env:
          WORKER_BASE: ${{ vars.WORKER_BASE }}
        run: |
          BASE="${WORKER_BASE:-https://el-sombrero-express.nic-58f.workers.dev}"
          echo "Pushing specials to $BASE"
          node scripts/push-specials.mjs "$BASE"

      - name: Archive special.json in git (best-effort)
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          SPECIAL_TZ: ${{ vars.SPECIAL_TZ }}
        run: |
          python3 scripts/update_special.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add special.json || true
          if git diff --staged --quiet; then
            echo "No special.json changes."
          else
            git commit -m "chore: update special.json archive [skip ci]" || true
            git push || true
          fi
