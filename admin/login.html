<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Admin Login | El Sombrero Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #18181b;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #eceff3 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f3efe8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.75rem 1.35rem 1.35rem;
      box-shadow: 0 18px 40px rgba(24, 24, 27, 0.06);
    }
    .brand {
      margin-bottom: 1.5rem;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    label {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 0.8rem;
      font: inherit;
      font-size: 16px;
      background: #fff;
      color: var(--ink);
    }
    input:focus {
      outline: 2px solid #18181b;
      outline-offset: 1px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.25rem 0 1.15rem;
    }
    .remember {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .remember input {
      width: 1rem;
      height: 1rem;
      accent-color: #18181b;
    }
    button[type="submit"] {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button[type="submit"]:hover { filter: brightness(1.08); }
    button[type="submit"]:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .error {
      margin: 0 0 0.9rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      background: #fef2f2;
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
    }
    .error.show { display: block; }
    .footer {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }
    .footer a {
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .footer span {
      color: var(--muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <h1>Admin sign in</h1>
      <p>El Sombrero Express menu &amp; submissions</p>
    </div>
    <p class="error" id="error" role="alert"></p>
    <form id="loginForm" autocomplete="on">
      <label>
        Username
        <input type="text" name="username" id="username" required autocomplete="username" autofocus>
      </label>
      <label>
        Password
        <input type="password" name="password" id="password" required autocomplete="current-password">
      </label>
      <div class="row">
        <label class="remember">
          <input type="checkbox" name="remember" id="remember" checked>
          Remember me
        </label>
      </div>
      <button type="submit" id="submit">Sign in</button>
    </form>
    <div class="footer">
      <a href="https://www.quantumlinksmarketing.com/" target="_blank" rel="noopener noreferrer">Get support</a>
      <span>QLM</span>
    </div>
  </main>
  <script>
    (async () => {
      try {
        const me = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        const data = await me.json();
        if (data && data.authenticated) {
          location.replace('/admin/index.html');
          return;
        }
      } catch (_) {}
    })();

    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.remove('show');
      error.textContent = '';
      submit.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            remember: document.getElementById('remember').checked
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Invalid username or password');
        }
        location.replace('/admin/index.html');
      } catch (err) {
        error.textContent = err.message || 'Sign in failed';
        error.classList.add('show');
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
